<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>离线计算器</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui}
body{background:#222;display:flex;justify-content:center;align-items:center;height:100vh}
.calc{background:#333;padding:20px;border-radius:16px;width:320px}
#screen{width:100%;padding:16px;font-size:2.2rem;text-align:right;margin-bottom:12px;border:none;background:#eee;border-radius:8px}
.btns{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
button{padding:18px;font-size:1.2rem;border:none;border-radius:8px;cursor:pointer}
.btn-op{background:#ff9500;color:white}
.btn-clear{background:#ff3b30;color:white}
button:active{opacity:0.8}
</style>
</head>
<body>
<div class="calc">
  <input type="text" id="screen" readonly>
  <div class="btns">
    <button class="btn-clear" onclick="clearAll()">C</button>
    <button onclick="del()">⌫</button>
    <button class="btn-op" onclick="appendChar('/')">/</button>
    <button class="btn-op" onclick="appendChar('*')">×</button>

    <button onclick="appendChar('7')">7</button>
    <button onclick="appendChar('8')">8</button>
    <button onclick="appendChar('9')">9</button>
    <button class="btn-op" onclick="appendChar('-')">-</button>

    <button onclick="appendChar('4')">4</button>
    <button onclick="appendChar('5')">5</button>
    <button onclick="appendChar('6')">6</button>
    <button class="btn-op" onclick="appendChar('+')">+</button>

    <button onclick="appendChar('1')">1</button>
    <button onclick="appendChar('2')">2</button>
    <button onclick="appendChar('3')">3</button>
    <button onclick="appendChar('.')">.</button>

    <button onclick="appendChar('0')">0</button>
    <button style="grid-column:span 3" onclick="calcResult()">=</button>
  </div>
</div>

<script>
const screen = document.getElementById('screen')
// 追加字符
function appendChar(c){
  screen.value += c
}
// 清空
function clearAll(){
  screen.value = ''
}
// 退格删除
function del(){
  screen.value = screen.value.slice(0,-1)
}
// 计算结果
function calcResult(){
  try{
    let exp = screen.value.replace(/×/g,'*')
    let res = eval(exp)
    screen.value = res
  }catch(e){
    screen.value = '错误'
  }
}
</script>
</body>
</html>
